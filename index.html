
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>七日問診</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #080808;
  color: #e8e8e8;
  font-family: "Noto Serif TC", serif;
  min-height: 100vh;
}

button {
  background: transparent;
  color: #ddd;
  border: 1px solid #555;
  padding: 13px 16px;
  width: 100%;
  text-align: left;
  font-size: 15px;
  margin: 6px 0;
  cursor: pointer;
}

button:active {
  background: #292929;
}

button:hover {
  border-color: #aaa;
}

#app {
  max-width: 680px;
  margin: auto;
  padding: 28px 22px;
}

#menu {
  text-align: center;
  padding-top: 18vh;
}

h1 {
  font-size: 32px;
  letter-spacing: 8px;
  font-weight: normal;
  margin-bottom: 12px;
}

.subtitle {
  color: #777;
  font-size: 12px;
  letter-spacing: 3px;
  margin-bottom: 65px;
}

#game {
  display: none;
}

.topline {
  color: #777;
  font-size: 12px;
  border-bottom: 1px solid #333;
  padding-bottom: 12px;
  margin-bottom: 28px;
}

#history {
  min-height: 260px;
  line-height: 2;
  white-space: pre-wrap;
}

.line {
  margin: 0 0 22px;
}

.speaker {
  color: #aaa;
  font-size: 13px;
  margin-bottom: 5px;
}

.dialogue {
  font-size: 16px;
}

#choices {
  margin-top: 30px;
}

#notice {
  color: #888;
  font-size: 12px;
  margin-top: 24px;
  text-align: center;
}

.red {
  color: #b40000;
}

.small {
  color: #666;
  font-size: 12px;
  text-align: center;
  margin-top: 25px;
}
</style>
</head>

<body>
<div id="app">

  <section id="menu">
    <h1>七日問診</h1>
    <div class="subtitle">SEVEN DAYS</div>

    <button onclick="newGame()">開始問診</button>
    <button onclick="continueGame()">繼續問診</button>
    <button onclick="showTutorial()">新手教學</button>
    <button onclick="showSettings()">設定</button>

    <div class="small">請確認你的精神狀態良好。</div>
  </section>

  <section id="game">
    <div class="topline">
      <span id="dayLabel">問診紀錄 01 / 07</span>
      <span style="float:right">112</span>
    </div>

    <div id="history"></div>
    <div id="choices"></div>
    <div id="notice"></div>
  </section>

</div>

<script>
const SAVE_KEY = "sevenDays_save_v1";

let game = {
  day: 1,
  history: [],
  remaining: [],
  started: false,
  finished: false
};

const firstQuestions = [
  {
    question: "知道，有人叫我來的。",
    answer: "那就省事了。希望你也知道接下來要做什麼。"
  },
  {
    question: "不知道，我只是照著通知過來。",
    answer: "……通知都看不懂？算了，坐下吧。"
  },
  {
    question: "我不記得了。",
    answer: "不記得？我們才剛開始，你就給我這種回答。"
  },
  {
    question: "你就是負責替我看診的人？",
    answer: "至少你還有基本的判斷能力。"
  },
  {
    question: "說實話，我覺得自己根本沒病。",
    answer: "很好，今天第一個有自信的病人。"
  },
  {
    question: "你猜猜看？",
    answer: "我沒有時間陪你玩猜謎。"
  }
];

function saveGame() {
  localStorage.setItem(SAVE_KEY, JSON.stringify(game));
}

function newGame() {
  game = {
    day: 1,
    history: [],
    remaining: [],
    started: true,
    finished: false
  };

  document.getElementById("menu").style.display = "none";
  document.getElementById("game").style.display = "block";

  game.remaining = [...firstQuestions];

  addLine("112", "你來了？坐吧。");
  addLine("112", "先說好，我不喜歡重複說明。如果你有問題，就一次問完。");
  addLine("112", "你知道自己為什麼來這裡嗎？");

  renderChoices();
  saveGame();
}

function continueGame() {
  const data = localStorage.getItem(SAVE_KEY);

  if (!data) {
    alert("目前沒有可讀取的紀錄。");
    return;
  }

  game = JSON.parse(data);

  document.getElementById("menu").style.display = "none";
  document.getElementById("game").style.display = "block";

  renderHistory();
  renderChoices();
}

function addLine(speaker, message) {
  game.history.push({ speaker, message });
  renderHistory();
}

function renderHistory() {
  const history = document.getElementById("history");
  history.innerHTML = "";

  game.history.forEach(item => {
    const line = document.createElement("div");
    line.className = "line";

    const speaker = document.createElement("div");
    speaker.className = "speaker";
    speaker.textContent = item.speaker;

    const dialogue = document.createElement("div");
    dialogue.className = "dialogue";
    dialogue.textContent = item.message;

    line.appendChild(speaker);
    line.appendChild(dialogue);
    history.appendChild(line);
  });

  document.getElementById("dayLabel").textContent =
    "問診紀錄 " + String(game.day).padStart(2, "0") + " / 07";

  window.scrollTo(0, document.body.scrollHeight);
}

function renderChoices() {
  const area = document.getElementById("choices");
  area.innerHTML = "";

  game.remaining.forEach((item, index) => {
    const button = document.createElement("button");
    button.textContent = item.question;
    button.onclick = () => chooseQuestion(index);
    area.appendChild(button);
  });

  if (!game.finished) {
    const end = document.createElement("button");
    end.textContent = "結束對話";
    end.onclick = endConversation;
    area.appendChild(end);
  }
}

function chooseQuestion(index) {
  const item = game.remaining[index];

  addLine("你", item.question);
  addLine("112", item.answer);

  game.remaining.splice(index, 1);

  renderChoices();
  saveGame();
}

function endConversation() {
  addLine("112", "今天就到這裡吧。");

  game.finished = true;
  game.remaining = [];

  renderChoices();
  document.getElementById("notice").textContent =
    "本次問診紀錄已保存。";

  saveGame();
}

function showTutorial() {
  alert(
    "新手教學\n\n" +
    "1. 點擊對話選項與角色交談。\n" +
    "2. 已選擇的問題會從選項中消失。\n" +
    "3. 可以繼續選擇其他問題。\n" +
    "4. 點擊「結束對話」完成當前對話。\n" +
    "5. 遊戲會自動保存目前進度。"
  );
}

function showSettings() {
  alert(
    "設定\n\n" +
    "目前為初始測試版本。\n" +
    "音量、文字速度及其他設定將於後續版本加入。"
  );
}
</script>
</body>
</html>
